<style>
:root{
  --bg:#10151f;--deep:#0c1019;--panel:#161c2a;--card:#1a2130;--border:#2a3344;
  --gold:#e8be6a;--sky:#6bc5e0;--mint:#5bd6a6;--violet:#a99af0;
  --rose:#ef8da3;--amber:#e89a5c;--cyan:#5fcdd8;--lime:#a8d96a;
  --text:#e6ebf2;--sub:#8a9bb0;--muted:#3a4658;
  --ok:#5bd6a6;--warn:#e8be6a;--danger:#ef8da3;
  --cmd:#e8be6a;--hla:#6bc5e0;--sci:#a99af0;--cre:#ef8da3;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;position:fixed;width:100%}
#app{height:100dvh;display:flex;flex-direction:column;max-width:600px;margin:0 auto;width:100%}
@media(min-width:640px){#app{border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 40px rgba(0,0,0,.35)}}

.topbar{padding:max(env(safe-area-inset-top),12px) 16px 10px;
  background:linear-gradient(180deg,var(--deep) 0%,rgba(6,10,20,.9) 100%);
  border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:10px;min-height:58px}
.logo-mark{width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.brand-name{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;letter-spacing:.5px;line-height:1}
.brand-sub{font-size:9px;color:var(--sub);letter-spacing:1px;margin-top:2px;line-height:1.3}
.live-pill{margin-left:auto;display:flex;align-items:center;gap:5px;
  background:rgba(47,232,160,.08);border:1px solid rgba(47,232,160,.2);
  border-radius:20px;padding:4px 9px;font-size:9px;color:var(--ok);font-weight:600;letter-spacing:1px}
.pulse-dot{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.tabs{display:flex;gap:0;background:var(--deep);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 13px;font-size:10.5px;font-weight:600;color:var(--sub);
  border:none;background:none;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.3px}
.tab.active{color:var(--gold);border-bottom-color:var(--gold)}
.tbadge{position:absolute;top:5px;right:3px;background:var(--rose);color:#fff;border-radius:8px;min-width:14px;height:14px;font-size:8px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
/* HOME MENU MAP */
.home-wrap{padding:14px 14px 28px}
.home-greet{font-size:12px;color:var(--sub);margin-bottom:3px}
.home-title{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;margin-bottom:14px;line-height:1.2}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{position:relative;background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:15px 14px;cursor:pointer;transition:transform .12s,border-color .2s;overflow:hidden;min-height:108px;
  display:flex;flex-direction:column;justify-content:space-between}
.tile:active{transform:scale(.96)}
.tile-ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:9px}
.tile-name{font-size:14px;font-weight:700;line-height:1.2}
.tile-desc{font-size:10px;color:var(--sub);margin-top:3px;line-height:1.4}
.tile-badge{position:absolute;top:11px;right:11px;background:var(--rose);color:#fff;border-radius:10px;
  min-width:18px;height:18px;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.tile-flag{position:absolute;top:10px;right:10px;border-radius:8px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.3px;display:inline-flex;align-items:center;gap:3px}
.flag-new{background:rgba(91,214,166,.18);color:var(--mint)}
.flag-confirm{background:rgba(239,141,163,.2);color:var(--rose);animation:softpulse 2s ease-in-out infinite}
.flag-info{background:rgba(107,197,224,.16);color:var(--sky)}
@keyframes softpulse{0%,100%{opacity:1}50%{opacity:.55}}
.tile-wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:13px;min-height:0;padding:13px 15px}
.tile-wide .tile-ic{margin-bottom:0}
.backbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--deep);border-bottom:1px solid var(--border)}
.backbtn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:7px 12px;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.backbtn:active{transform:scale(.95)}
.backbar-title{font-size:13px;font-weight:700;color:var(--text)}

.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:16px}
.content::-webkit-scrollbar{width:3px}
.content::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}

/* OFFICE */
.office-wrap{position:relative;width:100%;
  background:linear-gradient(180deg,#08122a 0%,#050a18 100%);
  border-radius:16px;border:1px solid var(--border);overflow:hidden;margin-bottom:14px}
.office-sky{height:50px;background:linear-gradient(180deg,#030610 0%,#071228 100%);position:relative;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle 3s infinite}
@keyframes twinkle{0%,100%{opacity:.8}50%{opacity:.1}}
.office-floor{display:flex;min-height:190px;padding:10px 8px 0;align-items:flex-end;overflow-x:auto}
.office-floor::-webkit-scrollbar{display:none}
.office-section{flex-shrink:0;width:68px;display:flex;flex-direction:column;align-items:center;margin-right:4px}
.desk{width:62px;height:22px;background:linear-gradient(180deg,#1e3050,#152040);
  border-radius:5px 5px 0 0;border:1px solid #253a5a}
.floor-div{width:1px;background:linear-gradient(180deg,transparent,var(--border),transparent);
  height:140px;align-self:center;flex-shrink:0;margin:0 3px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;cursor:pointer;margin-bottom:2px;transition:transform .2s}
.avatar:active{transform:scale(.88)}
.avatar.busy{animation:work 1.2s ease-in-out infinite}
.avatar.meeting{animation:meet 2s ease-in-out infinite}
.avatar.rest{animation:rest-anim 3s ease-in-out infinite}
.avatar.work{animation:idle 3.5s ease-in-out infinite}
@keyframes work{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes meet{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes rest-anim{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.speech-bub{position:absolute;top:-26px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--border);border-radius:7px;
  padding:3px 6px;font-size:7.5px;white-space:nowrap;color:var(--text);
  opacity:0;pointer-events:none;z-index:5;max-width:90px;text-align:center;
  animation:bub 7s ease-in-out infinite}
.speech-bub::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);
  border:3px solid transparent;border-top-color:var(--border)}
@keyframes bub{0%,10%,80%,100%{opacity:0;transform:translateX(-50%) translateY(3px)}
  20%,70%{opacity:1;transform:translateX(-50%) translateY(0)}}
.av-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.av-name{font-size:7px;font-weight:600;text-align:center;line-height:1.2}

/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px}
.paper-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;
  border-left:3px solid var(--hla)}
.sci-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px;margin-bottom:10px;
  border-left:3px solid var(--sci)}
.update-card{background:linear-gradient(135deg,rgba(72,200,240,.06),rgba(176,136,248,.04));
  border:1px solid rgba(72,200,240,.25);border-radius:13px;padding:14px;margin-bottom:10px}
.agent-card{background:var(--card);border:1px solid var(--border);border-radius:13px;
  padding:13px;margin-bottom:9px;cursor:pointer;transition:border-color .2s}
.agent-card.open{border-color:var(--gold)}
.recruit-card{background:linear-gradient(135deg,rgba(245,200,66,.04),rgba(245,200,66,.01));
  border:1px dashed rgba(245,200,66,.35);border-radius:13px;padding:14px;margin-bottom:10px}
.reorg-card{background:rgba(47,232,160,.03);border:1px solid rgba(47,232,160,.2);
  border-radius:13px;padding:14px;margin-bottom:10px}
.meeting-card{background:linear-gradient(135deg,rgba(176,136,248,.06),rgba(72,200,240,.04));
  border:1px solid rgba(176,136,248,.2);border-radius:13px;padding:14px;margin-bottom:10px}

/* ROW / ITEMS */
.row-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);
  font-size:11px;line-height:1.5;align-items:flex-start}
.row-item:last-child{border-bottom:none}
.dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:5px}

/* TYPOGRAPHY */
h2{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:2px}
.pg-sub{font-size:11px;color:var(--sub);margin-bottom:14px}
.lbl{font-size:8px;letter-spacing:2px;font-weight:700;color:var(--sub);margin-bottom:7px}
.chip{display:inline-block;font-size:8.5px;font-weight:700;border-radius:5px;padding:2px 7px;margin:2px}
.stat-bar{height:3px;background:var(--muted);border-radius:2px;overflow:hidden;margin-top:5px}
.stat-fill{height:100%;border-radius:2px;transition:width 1.5s}
.tag{font-size:8px;font-weight:700;padding:2px 7px;border-radius:4px;margin:2px;display:inline-block}

/* BUTTONS */
input,textarea{width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--border);
  border-radius:9px;color:var(--text);font-size:12px;outline:none;font-family:'DM Sans',sans-serif}
input:focus,textarea:focus{border-color:var(--gold)}
.btn-gold{background:var(--gold);color:#000;font-weight:700;font-size:12px;
  border:none;border-radius:9px;padding:10px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif}
.btn-ok{background:rgba(47,232,160,.15);color:var(--ok);border:1px solid rgba(47,232,160,.35);
  font-weight:600;font-size:11px;border-radius:9px;padding:8px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif}
.btn-dim{background:rgba(42,58,84,.5);color:var(--sub);border:1px solid var(--border);
  font-weight:600;font-size:11px;border-radius:9px;padding:8px;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif}
.pill{display:inline-block;padding:4px 10px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;color:var(--sub);font-size:10px;margin:2px;cursor:pointer}
.pill-on{background:var(--mint);color:#10151f;border-color:var(--mint);font-weight:700}
.spinner{width:24px;height:24px;border:2px solid rgba(245,200,66,.15);border-top-color:var(--gold);
  border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{text-align:center;font-size:10px;color:var(--sub);margin-top:6px}
</style>
</head>

// ── GLOBAL ERROR CATCHER (shows any silent JS error on screen) ──
function showErr(msg){
  var b=document.getElementById("errBanner");

  b.innerHTML="⚠ 오류 감지 (탭하면 닫힘):<br>"+String(msg).replace(/</g,"&lt;").slice(0,500);
}
window.addEventListener("error",function(e){ showErr((e.message||"error")+" @ "+(e.filename||"").split("/").pop()+":"+e.lineno); });

function importPersonal(file){
  const msg=document.getElementById('myInfoMsg'); if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const o=JSON.parse(rd.result);
      if(!o||o.format!=="histara-personal/1") throw new Error("Histara 내 정보 파일이 아니에요");
      if(o.personal) localStorage.setItem('histara_personal', JSON.stringify(o.personal));
      if(o.portfolio) localStorage.setItem('histara_portfolio', JSON.stringify(o.portfolio));
      if(o.kids) localStorage.setItem('histara_kids', JSON.stringify(o.kids));
      if(msg) msg.innerHTML='<span style="color:var(--mint)">✓ 넣었어요 — 다시 불러옵니다. 이제 파일은 지워도 돼요.</span>';
      setTimeout(()=>location.reload(),900);
    }catch(e){ if(msg) msg.innerHTML=`<span style="color:var(--danger)">✗ ${esc(String(e.message||e))}</span>`; } };
  rd.readAsText(file);
}
function exportPersonal(){
  const g=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
  const o={format:"histara-personal/1", exported:new Date().toISOString(), personal:g('histara_personal'), portfolio:g('histara_portfolio'), kids:g('histara_kids')};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
  a.download='histara_내정보.json'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
function clearPersonal(){ if(!confirm('이 기기에 저장된 내 정보(생일·집·직장·계좌·아이)를 지울까요?')) return;
  ['histara_personal','histara_portfolio','histara_kids'].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); location.reload(); }

    // content ideas / drafts → move to studio store

// ── CLOUD SYNC (Supabase) — shares STUDIO_ITEMS + REPORTS across devices. API key is NOT synced. ──
let SUPA_URL  = (function(){ try{return localStorage.getItem('histara_supa_url')||""}catch(e){return ""} })();
let SUPA_KEY  = (function(){ try{return localStorage.getItem('histara_supa_key')||""}catch(e){return ""} })();
let SYNC_CODE = (function(){ try{return localStorage.getItem('histara_sync_code')||""}catch(e){return ""} })();
let LAST_SYNC = (function(){ try{return localStorage.getItem('histara_last_sync')||""}catch(e){return ""} })();
function syncConfigured(){ return !!(SUPA_URL && SUPA_KEY && SYNC_CODE); }
function saveSyncConfig(url,key,code){
  SUPA_URL=(url||"").trim().replace(/\/+$/,""); SUPA_KEY=(key||"").trim(); SYNC_CODE=(code||"").trim();
  try{ localStorage.setItem('histara_supa_url',SUPA_URL); localStorage.setItem('histara_supa_key',SUPA_KEY); localStorage.setItem('histara_sync_code',SYNC_CODE); }catch(e){}
}
function mergeById(local, remote){
  const map={};
  (local||[]).forEach(x=>{ if(x&&x.id!=null) map[x.id]=x; });
  // union by id; on conflict keep local — unless the remote copy was changed later (upd = 마지막 수정 시각, Mint 자동 제작·알림 카드)
  (remote||[]).forEach(x=>{ if(!x||x.id==null) return; const l=map[x.id];
    if(!l || (Number(x.upd)||0) > (Number(l.upd)||0)){
      // 읽음은 한 번 읽으면 끝 — 한쪽이라도 읽었으면 읽음 (Mint가 숫자만 고친 사본이 'NEW'를 되살리지 않게)
      map[x.id]=(l&&l.read&&!x.read&&!(Number(x.unread_at)>(Number(l.read_at)||0)))?Object.assign({},x,{read:true,read_at:l.read_at}):x;
    } else if(x.read && !l.read) map[x.id]=Object.assign({},l,{read:true,read_at:x.read_at}); });
  return Object.values(map).sort((a,b)=>(b.id||0)-(a.id||0));
}
function _supaHeaders(){ return { "apikey":SUPA_KEY, "Authorization":"Bearer "+SUPA_KEY, "Content-Type":"application/json" }; }
async function syncPull(){
  if(!syncConfigured()) return {ok:false,msg:"동기화 설정이 필요해요"};
  // select=* returns whatever columns exist (safe even if 'english' column not added yet)
  const url=`${SUPA_URL}/rest/v1/histara_sync?code=eq.${encodeURIComponent(SYNC_CODE)}&select=*`;
  const r=await fetch(url,{headers:_supaHeaders()});
  if(!r.ok){ const t=await r.text().catch(()=> ""); return {ok:false,msg:"불러오기 실패 ("+r.status+") "+t.slice(0,80)}; }
  const rows=await r.json();
  let needPush=false;
  if(rows && rows[0]){
    const remoteStudio=rows[0].studio||[]; const remoteReports=rows[0].reports||[]; const remoteEnglish=rows[0].english||[];
    const _ids=a=>new Set((a||[]).map(x=>x&&x.id));
    const rS=_ids(remoteStudio), rR=_ids(remoteReports), rE=_ids(remoteEnglish);
    STUDIO_ITEMS=mergeById(STUDIO_ITEMS, remoteStudio); persistStudio();
    REPORTS=mergeById(REPORTS, remoteReports).slice(0,120); persistReports();
    ENGLISH_ITEMS=mergeById(ENGLISH_ITEMS, remoteEnglish).slice(0,120); persistEnglish();
    // 이 기기에만 있는 항목이 있으면 올려야 함
    needPush = STUDIO_ITEMS.some(x=>!rS.has(x.id)) || REPORTS.some(x=>!rR.has(x.id)) || (rows[0].english!==undefined && ENGLISH_ITEMS.some(x=>!rE.has(x.id)));
  } else {
    needPush = (STUDIO_ITEMS.length+REPORTS.length+ENGLISH_ITEMS.length)>0;
  }
  return {ok:true, needPush};
}
async function syncPush(){
  if(!syncConfigured()) return {ok:false,msg:"동기화 설정이 필요해요"};
  const full=[{ code:SYNC_CODE, studio:STUDIO_ITEMS, reports:REPORTS, english:ENGLISH_ITEMS, updated_at:new Date().toISOString() }];
  let r=await fetch(`${SUPA_URL}/rest/v1/histara_sync`,{
    method:"POST",
    headers:Object.assign({}, _supaHeaders(), {"Prefer":"resolution=merge-duplicates"}),
    body:JSON.stringify(full)
  });
  if(r.ok) return {ok:true};
  // if the 'english' column doesn't exist yet, retry without it so studio/reports still sync
  const t=await r.text().catch(()=> "");
  if(/english|column|PGRST204|42703|schema cache/i.test(t)){
    const base=[{ code:SYNC_CODE, studio:STUDIO_ITEMS, reports:REPORTS, updated_at:new Date().toISOString() }];
    const r2=await fetch(`${SUPA_URL}/rest/v1/histara_sync`,{
      method:"POST",
      headers:Object.assign({}, _supaHeaders(), {"Prefer":"resolution=merge-duplicates"}),
      body:JSON.stringify(base)
    });
    if(r2.ok) return {ok:true, warn:"english_column_missing"};
    const t2=await r2.text().catch(()=> ""); return {ok:false,msg:"올리기 실패 ("+r2.status+") "+t2.slice(0,80)};
  }
  return {ok:false,msg:"올리기 실패 ("+r.status+") "+t.slice(0,80)};
}

// ── 자동 동기화 (v11.3) ──
// 폰 홈 화면 앱은 다시 열어도 페이지를 새로 읽지 않는다 → 화면으로 돌아올 때·포커스·2분마다 내려받는다.
// 화면을 떠날 때는 기다리던 올리기를 바로 보낸다 (아이폰은 백그라운드로 가면 타이머가 멈춤).
let _pushTimer=null, _noPush=false, _pulling=false, _lastPull=0;
function syncPushDebounced(){ if(!syncConfigured()||_noPush)return; clearTimeout(_pushTimer); _pushTimer=setTimeout(()=>{ _pushTimer=null; syncPush().catch(()=>{}); }, 4000); }
function flushPush(){ if(!syncConfigured()||!_pushTimer) return; clearTimeout(_pushTimer); _pushTimer=null; syncPush().catch(()=>{}); }
function _syncSig(){ return [STUDIO_ITEMS,REPORTS,ENGLISH_ITEMS].map(a=>(a||[]).map(x=>x&&x.id).join(",")).join("|"); }
function _syncStamp(){ LAST_SYNC=new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); try{ localStorage.setItem('histara_last_sync',LAST_SYNC); }catch(e){} }
function _refreshSyncedView(){
  const t=document.getElementById('syncToast'); if(t) t.remove();
  if(STATE.tab==='studio') switchStudio(STATE.studioTab||'idea');
  else if(STATE.tab==='english'||STATE.tab==='brief') renderAll();
}
function _syncToast(n){
  // 작업 중인 화면을 갑자기 바꾸지 않도록, 새 항목이 왔다고만 알리고 누르면 반영
  let t=document.getElementById('syncToast');
  if(!t){ t=document.createElement('div'); t.id='syncToast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9999;background:#2fe8a0;color:#10151f;font-size:12px;font-weight:800;padding:9px 16px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap';
    t.onclick=_refreshSyncedView; document.body.appendChild(t); }
  t.textContent=`☁️ 다른 기기에서 새 항목 ${n}개 — 눌러서 보기`;
  clearTimeout(t._h); t._h=setTimeout(()=>{ if(t.parentNode) t.remove(); }, 20000);
}
async function autoPull(reason){
  if(!syncConfigured()||_pulling) return;
  if(reason!=='open' && Date.now()-_lastPull<15000) return;
  _pulling=true; _lastPull=Date.now();
  const before=_syncSig(), cnt=STUDIO_ITEMS.length+REPORTS.length+ENGLISH_ITEMS.length;
  _noPush=true;
  try{
    const r=await syncPull();
    _noPush=false;
    if(r&&r.ok){
      _syncStamp();
      if(r.needPush) syncPushDebounced();
      if(_syncSig()!==before){
        const n=Math.max(1,(STUDIO_ITEMS.length+REPORTS.length+ENGLISH_ITEMS.length)-cnt);
        if(reason==='open') _refreshSyncedView(); else if(STATE.tab==='studio'||STATE.tab==='english'||STATE.tab==='brief') _syncToast(n);
      }
      if(STATE.tab==='security'&&STATE.secTab==='sync'){ const b=document.getElementById('sec-body'); if(b) b.innerHTML=syncPanel(); }
    }
  }catch(e){} finally{ _noPush=false; _pulling=false; }
}
function autoSyncOnOpen(){ autoPull('open'); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') autoPull('resume'); else flushPush(); });
window.addEventListener('pageshow',e=>{ if(e.persisted) autoPull('resume'); });
window.addEventListener('pagehide',()=>flushPush());
window.addEventListener('focus',()=>autoPull('focus'));
setInterval(()=>{ if(document.visibilityState==='visible') autoPull('tick'); }, 120000);
function callCost(inTok,outTok,searches){
  return (inTok/1e6)*PRICE.inPerM + (outTok/1e6)*PRICE.outPerM + (searches||0)*PRICE.perSearch;
}
function recordCost(inTok,outTok,searches,searched){
  const now=new Date();
  const rec={ ts:now.getTime(), day:now.toISOString().slice(0,10), in:inTok||0, out:outTok||0, searches:searches||0,
    cost:callCost(inTok,outTok,searches), searched:!!searched, feature:curFeature() };
  USAGE.push(rec); persistUsage();
  // live refresh if on the usage tab
  if(STATE.tab==='security' && STATE.secTab==='usage'){ const b=document.getElementById('usage-body'); if(b) b.innerHTML=usagePanel(); }
}

const FEATURE_LABEL={studio:"🎬 콘텐츠·쇼츠",family:"🧺 가족 여가",english:"📚 영어",invest:"📈 투자·은퇴",advisor:"🔬 자문",

let CUR_FEATURE=null;
function curFeature(){ return CUR_FEATURE || (typeof STATE!=="undefined" && STATE.tab) || "other"; }
function featureKey(f){ return ({meetings:"team",agents:"team",recruit:"team",office:"team"})[f]||f||"other"; }
function usageByFeature(fromYM,toYM){
  const map={};
  USAGE.forEach(r=>{ const ym=monthKey(r.day); if(fromYM&&ym<fromYM) return; if(toYM&&ym>toYM) return;
    const k=r.feature?featureKey(r.feature):"untagged";
    if(!map[k]) map[k]={k,cost:0,calls:0,searches:0}; map[k].cost+=r.cost; map[k].calls++; map[k].searches+=r.searches; });
  return Object.values(map).sort((a,b)=>b.cost-a.cost);
}
function featureUsageHTML(fromYM,toYM,title){

  if(!rows.length) return "";
  return `<div class="card" style="padding:12px;margin-bottom:12px">
    <div style="font-size:10px;font-weight:700;color:#2fe8a0;margin-bottom:8px">${title}</div>
    ${rows.map(r=>`<div style="margin:6px 0">
      <div style="display:flex;font-size:10px"><span style="flex:1">${r.k==="untagged"?"기록 전 (v11 이전)":(FEATURE_LABEL[r.k]||r.k)}</span>
        <span style="color:var(--sub)">${r.calls}회${r.searches?` · 검색 ${r.searches}`:""} · <b style="color:var(--text)">$${r.cost.toFixed(3)}</b></span></div>
      <div style="height:5px;background:var(--deep);border-radius:3px;margin-top:3px"><div style="height:5px;width:${Math.max(2,Math.round(r.cost/tot*100))}%;background:#2fe8a0;border-radius:3px"></div></div>
    </div>`).join("")}
  </div>`;
}
function monthKey(d){ return d.slice(0,7); } // YYYY-MM
function ymLabel(ym){ const [y,m]=ym.split('-'); return `${y}.${m}`; }
// aggregate by month within [fromYM,toYM] inclusive (or all)
function usageByMonth(fromYM,toYM){
  const map={};
  USAGE.forEach(r=>{ const ym=monthKey(r.day);
    if(fromYM && ym<fromYM) return; if(toYM && ym>toYM) return;
    if(!map[ym]) map[ym]={ym,cost:0,in:0,out:0,searches:0,calls:0};
    map[ym].cost+=r.cost; map[ym].in+=r.in; map[ym].out+=r.out; map[ym].searches+=r.searches; map[ym].calls++;
  });
  return Object.values(map).sort((a,b)=>a.ym<b.ym?-1:1);
}
function usageRange(fromYM,toYM){
  const months=usageByMonth(fromYM,toYM);
  return months.reduce((s,m)=>({cost:s.cost+m.cost,in:s.in+m.in,out:s.out+m.out,searches:s.searches+m.searches,calls:s.calls+m.calls}),{cost:0,in:0,out:0,searches:0,calls:0});
}

      w.document.open(); w.document.write(doc); w.document.close();
      w.focus();
      return;
    }
    // popup blocked → fallback to Blob download of the HTML
    const blob = new Blob([doc], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'Histara-Shorts.html'; a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }catch(e){ showErr('PDF/인쇄 실패: '+(e.message||e)); }
}

🌙 읽는 사람: 40대 후반~60대 후반. 늦은 오후나 잠들지 못하는 밤에 혼자 본다. 그래서 narration은
- 1인칭 회상, 혼잣말처럼 낮고 담담하게. 다정한 반말체 독백("~였다", "~했다")이나 조용한 존댓말 중 하나로 끝까지 통일.
- 느낌표·감탄·호들갑 금지. 무섭거나 자극적인 말 대신, 부모 세대의 고생과 말하지 못한 사랑, 미안함과 고마움.
- 한 문장은 짧게(공백 포함 20자 안팎, 최대 24자) — 한 문장이 화면 자막 한 장이 된다. 쉼표로 호흡을 준다.
- 마지막 beat는 마음을 내려놓게 하는 조용한 한 문장 + 시청자가 3초 안에 답할 수 있는 짧은 질문이나 여운으로 끝낸다 (예: "오늘 밤은, 그 손이 생각난다.").

구조 (반전 있는 사연): 후크 → 상황 → 전환점(8~15초에 2차 후킹) → 반전 → 여운+짧은 질문.
- beats 5~7개. 각 beat는 화면 한 장면이고 sec(화면 길이, 3~14초)를 정한다. sec 합계 45~56초 (끝에 구독 화면 4초가 자동으로 붙는다).
- 나이 든 시청자가 천천히 읽을 수 있게: 각 beat의 narration 글자 수(공백 제외)는 (sec − 1) × 3 이내, 한 beat에 1~3문장, 전체는 공백 제외 130~160자. 글이 많으면 자막이 빨리 넘어가 잔잔함이 깨진다 — 말을 아껴라.
- narration: 문장은 마침표로 끝냄. 숫자는 읽기 쉬운 표기 그대로 (예: "매달 3만원", "20년").
- 첫 beat(role "hook")는 3~5초. 인사·도입 없이 가장 강한 한 문장.
- 반전이 드러나는 beat 하나는 role "twist". 나머지는 "normal".
- narrator: 이야기를 말하는 "나"의 성별 ("여성" 또는 "남성"). 모르면 "여성".

🔍 현실 고증: 사물이 그 장소에 실제로 있을 법한지, 시대가 섞이지 않는지(삐삐·통장·손편지 vs 카톡·스마트폰), 크기·보존 상태·나이·금액이 맞는지 확인하고 realism_check에 한 줄로 적어라. 어색하면 그 디테일을 바꿔서 다시 써라.

// 나레이션 문장 정리 — Mint narrate.py 와 같은 문장 나누기 규칙 (. ? ! … 뒤)
function _ttsText(t){ return String(t||"").replace(/\s+/g," ").trim(); }
// 화면 자막 나누기 — 한 문장 = 자막 한 장, 22자 넘는 문장은 가운데 쉼표에서 나눔 (Mint story.py caption_chunks 와 같은 규칙)
function _capChunks(t){
  const out=[];
  _sentences(t).forEach(s=>{
    const parts=s.split(/,\s*/);
    if(s.replace(/\s/g,"").length<=22 || parts.length<2){ out.push(s); return; }
    let best=1, bd=1e9;
    for(let i=1;i<parts.length;i++){ const d=Math.abs(parts.slice(0,i).join(", ").length - s.length/2); if(d<bd){bd=d;best=i;} }
    out.push(parts.slice(0,best).join(", ")+","); out.push(parts.slice(best).join(", "));
  });
  return out.slice(0,6);
}
function _sentences(t){ return (_ttsText(t).match(/[^.?!…]+(?:[.?!…]+|$)/g)||[]).map(s=>s.trim()).filter(Boolean).map(s=>s.replace(/\.$/,"")); }

  "안경":"돋보기안경","시계":"벽시계","봉투":"돈봉투","약":"약봉지","밥":"밥그릇","꽃":"국화"};
function _mintMatch(name, list, def){
  if(!name) return def;
  const k=_mk(name), keys=list.map(_mk);
  let i=keys.indexOf(k); if(i>=0) return list[i];
  // 단어 맞추기: "시골 부엌" → "부엌 · 시골"
  let best=-1, bs=0;
  list.forEach((c,j)=>{ const tk=String(c).split(/[\s·]+/).filter(Boolean);
    const hit=tk.filter(t=>k.includes(t)).length + (keys[j].includes(k)?0.5:0);
    const sc=hit? hit + hit/tk.length*0.1 : 0; if(sc>bs){bs=sc;best=j;} });
  if(best>=0) return list[best];
  for(const w of Object.keys(MINT_SYN).sort((a,b)=>b.length-a.length)){ if(k.includes(w) && list.includes(MINT_SYN[w])) return MINT_SYN[w]; }
  return def;
}
function _mintSec(tc){ const m=String(tc||"").match(/(\d+):(\d+)\s*[-~–]\s*(\d+):(\d+)/); if(!m) return 0; return ((+m[3])*60+(+m[4]))-((+m[1])*60+(+m[2])); }
function _mintWrap(t){
  // 어절 단위로 줄을 고르게 (한 줄 12자 안팎, 최대 3줄) — Mint story.py wrap()과 같은 규칙
  t=String(t||"").trim(); if(!t) return "";
  if(t.includes("\n")) return t.split("\n").map(x=>x.trim()).filter(Boolean).slice(0,3).join("\n");
  const w=t.split(/\s+/);
  if(t.length<=12 || w.length<2) return t;
  const n=Math.min(w.length, t.length<=26?2:3);
  let best=null, bs=1e9;
  const tryCut=(b)=>{ const L=[]; for(let i=0;i<b.length-1;i++) L.push(w.slice(b[i],b[i+1]).join(" "));
    const sc=Math.max(...L.map(x=>x.length))-(L.slice(0,-1).some(x=>x.endsWith(","))?3.5:0); if(sc<bs){bs=sc;best=L;} };
  if(n===2){ for(let i=1;i<w.length;i++) tryCut([0,i,w.length]); }
  else { for(let i=1;i<w.length-1;i++) for(let j=i+1;j<w.length;j++) tryCut([0,i,j,w.length]); }
  return best.join("\n");
}

// AI가 준 장면표를 Mint 어휘로 정리 (모르는 이름은 가장 가까운 것으로)
function normMintCuts(cuts){
  const SP=Object.keys(MINT_SPACES), HR=Object.keys(MINT_HAIR), CL=Object.keys(MINT_CLOTH);
  return (cuts||[]).slice(0,8).map((c,i)=>{
    c=c||{};
    const sym = c.scene==="symbol" || (c.symbol && !c.space);
    const narr=_ttsText(c.narration||"");
    // 목소리 없음 — 나레이션이 있으면 그 문장들이 화면 자막 (예전 패키지도 같은 방식으로)
    const caps=(narr?_capChunks(narr):(Array.isArray(c.captions)?c.captions:[c.caption||c.onscreen_ko||""])).map(_mintWrap).filter(Boolean).slice(0,6);
    const out={tc:c.tc||"", sec:Math.max(3, Math.min(18, Number(c.sec)||_mintSec(c.tc)||8)),
      role: c.role==="hook"||c.role==="twist" ? c.role : (i===0?"hook":"normal"),
      time:_mintMatch(c.time, MINT_TIMES, "낮"), captions: caps.length?caps:[""]};
    if(narr) out.narration=narr;
    if(sym){
      out.scene="symbol"; out.symbol=_mintMatch(c.symbol, MINT_SYMBOLS, "편지");
      out.detail=String(c.detail||"").slice(0,12);
    }else{
      out.scene="space"; out.space=_mintMatch(c.space, SP, "안방 · 시골");
      out.people=(c.people||[]).slice(0,2).map(p=>{
        let pose=/앉|sit|seat|무릎/.test(String(p.pose||""))?"앉음":"서있음";
        if(pose==="앉음" && !MINT_SEAT_OK.includes(out.space)) pose="서있음";
        return {who:String(p.who||"").slice(0,8), hair:_mintMatch(p.hair,HR,"쪽진머리"), cloth:_mintMatch(p.cloth,CL,"카디건"), pose, reach:!!p.reach};
      });
    }
    return out;
  });
}

// 장면표가 없을 때(예전 패키지) — 나레이션·자막으로 기본 장면표를 만든다
function mintFromPkg(p){
  if(p.mint && (p.mint.cuts||[]).length) return {cuts:normMintCuts(p.mint.cuts), fallback:false};
  const narr=p.narration||[], cap=p.capcut||[];
  const cuts=narr.map((n,i)=>({tc:n.tc, sec:_mintSec(n.tc)||8, role:i===0?"hook":(i===3?"twist":"normal"),
    space:"안방 · 시골", time:"낮", people:[{hair:"쪽진머리",cloth:"카디건",pose:"앉음"}],
    captions:[(cap[i]&&cap[i].onscreen_ko)||n.ko||""]}));
  return {cuts:normMintCuts(cuts), fallback:true};
}

function mintStoryObj(p){

function downloadMintStory(btn){
  if(!LAST_SHORTS){ showErr("쇼츠 패키지를 먼저 만들어 주세요"); return; }
  const o=mintStoryObj(LAST_SHORTS);
  const blob=new Blob([JSON.stringify(o,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`hajuna_story_${String(o.no||0).padStart(3,"0")}_${o.date||"x"}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);

}

const WISDOM_SOURCES=["명심보감 안분편","명상록 4.17","하버드 성인발달연구","법구경 5","전도서 3장","잠언 15장","마태복음 6장",

function pickWisdomSeed(){
  const used=shortsItems().map(r=>r.pkg&&r.pkg.wisdom&&r.pkg.wisdom.id).filter(Boolean);
  const fresh=WISDOM_SEEDS.filter(w=>!used.includes(w.id));
  if(fresh.length) return fresh[0];
  // 다 썼으면 가장 오래전에 쓴 것부터 (같은 근거로 새 장면을 짓게)
  const last={}; used.forEach((id,i)=>{ if(!(id in last)) last[id]=i; });
  return WISDOM_SEEDS.slice().sort((a,b)=>(last[b.id]??-1)-(last[a.id]??-1))[0];
}
function wisdomBlock(w){ return `
🌿 이번 편은 '이제라도 알면 좋은 삶의 지혜' 편이다 (부모·유품 사연의 결은 그대로).
구조: 장면(후크) → 사연 → 깨달음(반전, role "twist") → 근거 한 줄 → 오늘의 한 줄 + 질문.
- 반전 바로 다음 beat 하나가 '근거 컷'이다. 그 beat의 narration은 정확히 「${w.line} — ${w.src}」 이 한 줄만 (글자 하나 바꾸지 마라, sec 10~12).
- 마지막 beat: 「${w.today}」와 같은 결의 한 문장 + 질문 「${w.q}」 (다듬어도 되지만 뜻은 그대로).
- 위 근거 말고 다른 명언·인물·책을 지어내 인용하지 마라. 따옴표로 남의 말을 만들지 마라.
- 훈계 금지: "~해야 한다", "~하세요", "당신은" 대신 1인칭 "나는 이제야 알았다". 끝은 명령이 아니라 질문.
- 이 이야기는 지어낸 것이다. 실존 인물·실화라고 말하지 마라.`; }
// 지혜 편 점검 — 근거 한 줄이 그대로 들어갔는지, 훈계조·표에 없는 인용이 없는지
function _wisdomCheck(p){
  const w=p.wisdom; if(!w) return [];
  const cuts=(p.mint&&p.mint.cuts)||[]; const all=cuts.map(c=>c.narration||"").join(" ");
  const norm=t=>String(t||"").replace(/[\s.,'"「」『』—-]/g,"");
  const out=[];
  if(!norm(all).includes(norm(w.line).slice(0,12))) out.push("근거 한 줄이 빠졌어요 — 지혜 편은 표의 근거를 그대로 넣어야 해요.");
  if(/해야\s?한다|하세요|하십시오|당신은|여러분/.test(all)) out.push("훈계조 표현이 있어요 (~해야 한다/~하세요/당신은) — 1인칭 깨달음으로 바꾸는 게 좋아요.");
  const cites=(all.match(/『[^』]+』/g)||[]).filter(c=>!WISDOM_SOURCES.some(s=>s.includes(c)));
  if(cites.length) out.push(`출처 표에 없는 책이 나와요: ${cites.join(", ")}`);
  return out;
}
function coherenceCheck12(p){
  const issues=[], cuts=(p.mint&&p.mint.cuts)||[];
  const all=cuts.map(c=>c.narration||"").join(" ");
  const total=cuts.reduce((s,c)=>s+(Number(c.sec)||0),0);
  if(p._seed && p._seed.story && all && _overlap(p._seed.story, all+" "+cuts.map(c=>c.captions.join(" ")).join(" ")) < 0.12)
    issues.push("이야기가 승인한 초안과 많이 달라요 (다른 상황을 지어냈을 수 있어요).");
  if(total>56) issues.push(`화면 길이 합계가 ${total}초예요 — Mint가 56초로 줄이면 자막도 그만큼 빨리 넘어가요.`);
  else if(total<40) issues.push(`화면 길이 합계가 ${total}초로 짧아요. 이 채널은 45~60초에서 시청률이 가장 높았어요.`);
  const nchar=_nchars(all);
  if(nchar>170) issues.push(`나레이션(자막)이 모두 ${nchar}자예요 — 천천히 읽으려면 130~160자가 56초에 맞아요. 자막이 빨리 넘어가요. 다시 생성을 권해요.`);
  const over=cuts.map((c,i)=>({i:i+1,n:_nchars(c.narration),b:narrBudget(c.sec)})).filter(x=>x.n>x.b+3);
  if(over.length) issues.push(`나레이션이 화면보다 긴 컷: ${over.map(x=>`${x.i}번(${x.n}자/권장 ${x.b}자)`).join(", ")} — 그 화면 자막이 빨리 넘어가요. 줄이는 게 좋아요.`);
  const longC=cuts.flatMap(c=>c.captions||[]).filter(s=>s.replace(/\n/g,"").length>30).length;
  if(longC) issues.push(`긴 자막 ${longC}개 — 한 장에 24자 안팎이 읽기 좋아요.`);
  if(!cuts.some(c=>c.role==="twist") && !p.twist) issues.push("반전 장면이 표시되지 않았어요.");
  if(/!/.test(all)) issues.push("나레이션에 느낌표가 있어요 — 밤에 보는 잔잔한 톤과 맞지 않아요.");
  if((all.match(/[A-Za-z]{3,}/g)||[]).length>=2) issues.push("나레이션에 영어가 섞여 있어요.");
  if(/(삐삐|공중전화|타자기|호롱불)/.test(all) && /(카톡|카카오톡|스마트폰|문자메시지|인스타)/.test(all)) issues.push("고증 의심: 옛 시대 물건과 현재 물건이 섞였어요.");
  if(!p.realism_check) issues.push("현실 고증 확인이 비어 있어요.");
  if(!(p.comment_bait||[]).length) issues.push("댓글 유도 문구가 비어 있어요.");
  if(cuts.some((c,i)=>i>0 && c.scene==="symbol" && cuts[i-1].scene==="symbol" && c.symbol===cuts[i-1].symbol)) issues.push("같은 물건 사진이 연달아 나와요 — 지루해 보여요. 다시 생성을 권해요.");
  if(p.scenes_ok===false) issues.push("장면표 일부를 AI가 못 채워 기본 장면(안방)으로 넣었어요. 다시 생성을 권해요.");
  return {ok:issues.length===0, issues};
}

function recordHealth(areaKey, ok, detail){
  HEALTH[areaKey] = {status: ok?"ok":"fail", ts:new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}), detail:detail||""};

function areaStatus(key){ return (HEALTH[key]&&HEALTH[key].status)||"idle"; }
function agentOps(agentId){
  // find areas this agent is responsible for; worst status wins (fail>idle>ok for attention)
  let found=null, hasFail=false, hasOk=false;
  Object.keys(OPS_AREAS).forEach(k=>{
    if(OPS_AREAS[k].agents.includes(agentId)){ found=true; const s=areaStatus(k); if(s==="fail")hasFail=true; if(s==="ok")hasOk=true; }
  });
  if(!found) return "support";        // no direct function (support role)
  if(hasFail) return "fail";
  if(hasOk) return "ok";
  return "idle";
}

// ── v13 콘텐츠 스튜디오: 버튼 하나 → 오늘의 사연 → 쇼츠(Mint 파일)까지 자동. 만든 쇼츠만 보기 좋게 나열 ──
function renderStudio(){
  return `<div style="padding:14px 14px 8px">
    <h2>🎬 콘텐츠 스튜디오</h2>
    <div class="pg-sub">버튼 하나로 오늘의 사연 → 쇼츠(Mint 영상 파일)까지 자동 · 하루 한 편</div>
  </div>
  <div id="studio-body" style="padding:0 14px 20px">${renderStudioBody()}</div>`;
}
function switchStudio(){ const b=document.getElementById("studio-body"); if(b) b.innerHTML=renderStudioBody(); }
function shortsItems(){ return STUDIO_ITEMS.filter(x=>x.type==="shorts"); }
function renderStudioBody(){
  const done=lastIdeaDate()===todayKey();
  const all=shortsItems();
  const st=r=>r.up?"up":((r.got||r.yt)?"got":"new");
  const cnt={all:all.length,new:all.filter(r=>st(r)==="new").length,got:all.filter(r=>st(r)==="got").length,up:all.filter(r=>st(r)==="up").length};
  const f=STATE.shortsFilter||"all";
  const list=all.filter(r=>f==="all"||st(r)===f);
  const old=STUDIO_ITEMS.filter(x=>x&&x.type!=="notice"&&x.type!=="status").length-all.length;
  const notes=noticeItems();
  markSeenLater("studio", list.concat(notes).filter(x=>!x.read).map(x=>x.id));
  return `${mintStatusCard()}${notes.map(noticeCard).join("")}<div class="card" style="border-color:rgba(239,141,163,.4);background:linear-gradient(135deg,rgba(239,141,163,.1),transparent);margin-bottom:14px">
    <div style="font-size:12px;font-weight:800;color:var(--rose)">💡 오늘의 쇼츠 만들기</div>
    <div style="font-size:10px;color:var(--sub);line-height:1.6;margin:4px 0 9px">사연 아이디어 → 나레이션 자막 → 장면표·배경음악·업로드 문구까지 한 번에 만들고 아래 목록에 저장해요 (1~2분).${done?' <b style="color:var(--mint)">오늘 한 편 만들었어요.</b>':''}</div>
    <input id="shortsTopic" placeholder="주제가 있으면 적어 주세요 (비워 두면 자동으로 골라요)" style="margin-bottom:8px" onkeydown="if(event.key==='Enter')autoShorts()">
    <label style="display:flex;align-items:center;gap:6px;font-size:10px;color:var(--sub);margin-bottom:8px;cursor:pointer"><input type="checkbox" id="wisdomChk" style="width:auto;margin:0"> 🌿 삶의 지혜 편으로 (씨앗 ${WISDOM_SEEDS.length}편 중 안 쓴 것부터)</label>
    <button class="btn-gold" style="background:var(--rose)" onclick="autoShorts({wisdom:!!(document.getElementById('wisdomChk')||{}).checked})">${done?'🔄 한 편 더 만들기':'💡 오늘의 쇼츠 만들기'}</button>
    <div id="shortsResult" style="margin-top:10px"></div>
  </div>
  ${perfBoard()}
  <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:9px">
    <span style="font-size:11px;font-weight:800;color:var(--text);margin-right:4px">🎞️ 만든 쇼츠</span>
    ${[["all","전체"],["new","만들 차례"],["got","올릴 차례"],["up","올림"]].map(([k,l])=>`<span class="pill ${f===k?'pill-on':''}" onclick="STATE.shortsFilter='${k}';switchStudio()">${l} ${cnt[k]}</span>`).join("")}
  </div>
  ${list.length?list.map(shortsCard).join(""):`<div class="card" style="text-align:center;padding:18px;color:var(--muted);font-size:11px">${all.length?'이 조건의 쇼츠가 없어요.':'아직 만든 쇼츠가 없어요. 위 버튼을 눌러 보세요.'}</div>`}
  <div style="font-size:9px;color:var(--muted);line-height:1.7;margin-top:10px">만들 차례 = Mint 파일을 아직 안 받음 · 올릴 차례 = Mint 파일 받음 또는 🤖 Mint가 비공개로 올려 둠 · 올림 = 유튜브에 공개함</div>
  ${old>0?`<div style="text-align:center;margin-top:10px"><button class="pill" style="font-size:9px" onclick="if(confirm('예전 아이디어·초안·전자책·채널 분석 ${old}개를 지울까요? (만든 쇼츠는 그대로)')){STUDIO_ITEMS=STUDIO_ITEMS.filter(x=>x&&(x.type==='shorts'||x.type==='notice'||x.type==='status'));persistStudio();switchStudio();}">🧹 예전 아이디어·초안·분석 ${old}개 지우기</button></div>`:""}`;
}
// 📊 채널 성과 판 (v14.1) — Mint가 하루 한 번 채널의 최근 60일 영상 숫자를 상태 줄에 실어 보냄. 10/30 회의 자료
function _perfRows(){
  const st=STUDIO_ITEMS.find(x=>x&&x.type==="status"); const rows=(st&&st.channel_stats)||[];
  const byId={}; shortsItems().forEach(r=>{ if(r.yt&&r.yt.id) byId[r.yt.id]=r; });
  return {st, rows:rows.map(x=>{ const it=byId[x.id]; const p=(it&&it.pkg)||{};
    return Object.assign({},x,{no:p.no||"", topic:p.topic==="wisdom"?"지혜":"부모", mood:(p.music&&p.music.mood)||"",
      title:x.title||p.title||"", lr:(x.views&&x.likes!=null)?x.likes/x.views*100:null}); })};
}
function _spark(h){ h=(h||[]).filter(v=>typeof v==="number"); if(h.length<2) return "";
  const W=64,H=18,mx=Math.max(...h),mn=Math.min(...h),sp=(mx-mn)||1;
  const pts=h.map((v,i)=>`${(i/(h.length-1)*W).toFixed(1)},${(H-2-(v-mn)/sp*(H-4)).toFixed(1)}`).join(" ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="조회 추이" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="var(--mint)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`; }
function _avg(a){ a=a.filter(v=>typeof v==="number"); return a.length?a.reduce((t,v)=>t+v,0)/a.length:null; }
function perfBoard(){
  const {st,rows}=_perfRows(); if(!rows.length) return "";
  const pub=rows.filter(r=>r.privacy==="public"); const open=!!STATE.perfOpen;
  const f=n=>typeof n==="number"?Math.round(n).toLocaleString("ko-KR"):"–", pc=n=>typeof n==="number"?`${n.toFixed(n<10?1:0)}%`:"–";
  const total=pub.reduce((t,r)=>t+(r.views||0),0);
  const groups=["부모","지혜"].map(t=>({t,r:pub.filter(x=>x.topic===t)})).filter(g=>g.r.length);
  const day=st&&st.stats_at?(()=>{ const d=new Date(st.stats_at); return isNaN(d)?st.stats_at.slice(5,10).replace("-","/"):`${d.getMonth()+1}/${d.getDate()} ${d.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})}`; })():(st&&st.stats_day?st.stats_day.slice(5).replace("-","/"):"");
  const chip=(l,v)=>`<div style="background:var(--deep);border:1px solid var(--border);border-radius:9px;padding:6px 9px;min-width:72px"><div style="font-size:8.5px;color:var(--sub)">${l}</div><div style="font-size:13px;font-weight:800;font-variant-numeric:tabular-nums">${v}</div></div>`;
  return `<div class="card" style="padding:11px 12px;margin-bottom:12px">
    <div onclick="STATE.perfOpen=!STATE.perfOpen;switchStudio()" style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <span style="font-size:12px;font-weight:800">📊 채널 성과</span>
      <span style="font-size:9px;color:var(--sub)">최근 60일 · 공개 ${pub.length}편${day?` · ${day} 기준`:""}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:10px">${open?'▲':'▼'}</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
      ${chip("총 조회",f(total))}${chip("편당 평균",f(_avg(pub.map(r=>r.views))))}${chip("평균 시청",pc(_avg(pub.map(r=>r.avp))))}${chip("좋아요율",pc(_avg(pub.map(r=>r.lr))))}${chip("댓글",f(pub.reduce((t,r)=>t+(r.comments||0),0)))}
    </div>
    ${open?`${groups.length>1?`<div style="font-size:10px;color:var(--sub);margin-top:9px;line-height:1.6">${groups.map(g=>`<b style="color:var(--text)">${g.t}</b> ${g.r.length}편 · 평균 👁 ${f(_avg(g.r.map(r=>r.views)))} · 시청 ${pc(_avg(g.r.map(r=>r.avp)))}`).join("<br>")}</div>`:""}
    <div style="overflow-x:auto;margin-top:9px"><table style="width:100%;border-collapse:collapse;font-size:10px;font-variant-numeric:tabular-nums">
      <tr style="color:var(--sub);text-align:left"><th style="padding:4px 3px;font-weight:600">날짜</th><th style="padding:4px 3px;font-weight:600">제목</th><th style="padding:4px 3px;font-weight:600;text-align:right">👁</th><th style="padding:4px 3px;font-weight:600;text-align:right">시청</th><th style="padding:4px 3px;font-weight:600;text-align:right">👍율</th><th style="padding:4px 3px;font-weight:600;text-align:right">💬</th><th style="padding:4px 3px;font-weight:600">추이</th></tr>
      ${rows.map(r=>`<tr style="border-top:1px solid var(--border)${r.privacy!=="public"?";opacity:.55":""}"><td style="padding:5px 3px;white-space:nowrap">${esc((r.pub||"").slice(5).replace("-","/"))}</td><td style="padding:5px 3px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.no?`#${esc(String(r.no))} `:""}${esc(r.title)}${r.topic==="지혜"?' <span style="color:var(--gold)">·지혜</span>':""}</td><td style="padding:5px 3px;text-align:right">${f(r.views)}</td><td style="padding:5px 3px;text-align:right">${pc(r.avp)}</td><td style="padding:5px 3px;text-align:right">${pc(r.lr)}</td><td style="padding:5px 3px;text-align:right">${f(r.comments)}</td><td style="padding:5px 3px">${_spark(r.h)}</td></tr>`).join("")}
    </table></div>
    <div style="display:flex;gap:6px;align-items:center;margin-top:9px"><button class="pill" style="font-size:9px" onclick="perfCopy(this)">📋 회의용 표 복사</button><span style="font-size:8.5px;color:var(--muted)">흐린 줄 = 아직 비공개 · 시청 %는 공개 1~2일 뒤부터</span></div>`:""}
  </div>`;
}
function perfCopy(btn){ const {st,rows}=_perfRows(); const f=n=>typeof n==="number"?String(Math.round(n)):"-", pc=n=>typeof n==="number"?n.toFixed(1)+"%":"-";
  const t=[`HaJuNa 채널 성과 (${(st&&st.stats_day)||""} 기준, 최근 60일)`,"| 날짜 | # | 제목 | 주제 | 분위기 | 공개 | 조회 | 시청% | 좋아요 | 좋아요율 | 댓글 | 조회 추이 |","|---|---|---|---|---|---|---|---|---|---|---|---|"]
    .concat(rows.map(r=>`| ${r.pub||""} | ${r.no||""} | ${String(r.title||"").replace(/\|/g,"/")} | ${r.topic} | ${r.mood||""} | ${r.privacy==="public"?"공개":"비공개"} | ${f(r.views)} | ${pc(r.avp)} | ${f(r.likes)} | ${pc(r.lr)} | ${f(r.comments)} | ${(r.h||[]).join("→")} |`)).join("\n");
  const done=()=>{ if(btn){ btn.textContent="✅ 복사했어요 — Claude 대화에 붙여 넣기"; setTimeout(()=>{btn.textContent="📋 회의용 표 복사";},2500);} };
  try{ navigator.clipboard.writeText(t).then(done,()=>{ prompt("아래를 길게 눌러 복사하세요",t); }); }catch(e){ prompt("아래를 길게 눌러 복사하세요",t); } }
// 🔑 해야 할 일 — Mint 자동 제작이 올리는 알림 (예: YouTube 로그인 만료 전)
function _todoList(t){ if(!t||!t.length) return "";
  return `<div style="margin-top:7px;padding:8px 10px;background:var(--deep);border:1px solid var(--border);border-radius:8px">
    <div style="font-size:9px;font-weight:800;color:var(--gold);margin-bottom:4px">📋 해야 할 일</div>
    <ol style="margin:0;padding-left:18px;font-size:10px;line-height:1.7;color:var(--text)">${t.map(x=>`<li>${esc(x).replace(/(python3 [^\s].*?(?:--\w+|\.py))(?=\s|$)/g,'<code style="font-size:9.5px;word-break:break-all">$1</code>')}</li>`).join("")}</ol></div>`; }
// 🖥️ Mint 자동 제작 상태 — Mint가 매일 확인할 때 올리는 한 줄 (이틀 넘게 소식이 없으면 경고)
function mintStatus(){ return STUDIO_ITEMS.find(x=>x&&x.type==="status"); }
function _mdh(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]}) ${d.toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'})}`; }
function _md(iso){ if(!iso) return ""; const d=new Date(iso); if(isNaN(d)) return ""; return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`; }
function mintStatusCard(){
  const m=mintStatus(); if(!m) return "";
  const now=Date.now(), chk=new Date(m.checked_at).getTime();
  const hrs=isNaN(chk)?999:(now-chk)/3600000;
  const stale=hrs>50;                                        // 매일 확인 → 이틀 넘게 소식 없음
  const loginLeft=m.login_until?(new Date(m.login_until).getTime()-now)/86400000:null;
  const fail=m.kind==="fail";
  const st= stale?["🔴","Mint 소식이 "+Math.floor(hrs/24)+"일째 없어요","var(--danger)"]
          : fail?["🟠","Mint 자동 제작 · 지난 확인에서 문제","var(--gold)"]
          : ["🟢","Mint 자동 제작 · 정상","var(--mint)"];
  let next="";
  if(m.next&&parseFloat(m.ver||0)>=6.8){ const due=new Date(m.next);       // Mint v6.8: 실제로 돌 시각(날짜 + 확인 시각)을 보냄
    if(!isNaN(due)) next=`다음 제작 <b>${_md(due.toISOString())} ${due.toLocaleTimeString("ko-KR",{hour:"numeric",minute:"2-digit"})}</b>`; }
  else if(m.next){ const nd=new Date(new Date(m.next).getTime()-3*3600000); const due=new Date(nd); const [hh,mm]=(m.time||"20:00").split(":").map(Number);   // 예전 Mint: 3시간 일찍 돼도 그날로 침
    if(due.getHours()*60+due.getMinutes()>hh*60+mm) due.setDate(due.getDate()+1);   // 그날 확인 시각이 지났으면 다음 날 확인 때
    due.setHours(hh,mm,0,0); if(due.getTime()<now) due.setTime(now);
    next=`다음 제작 <b>${_md(due.toISOString())} 저녁</b>`; }
  const login=loginLeft===null?"":` · YouTube 로그인 <b style="color:${loginLeft<=3?'var(--gold)':'inherit'}">${loginLeft<0?'풀림':_md(m.login_until)+'까지'}</b>`;
  const todo=stale?_todoList(["Mint 노트북 전원·잠자기 확인 (뚜껑을 닫았다면 잠들었는지)","Mint 터미널(Ctrl+Alt+T)에서 systemctl --user list-timers hajuna-auto.timer → LAST 시각 확인","지금 바로 확인만: python3 ~/hajuna/auto/run.py"]):"";
  return `<div class="card" style="padding:10px 13px;margin-bottom:12px;border-color:${st[2]}66">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:15px">${st[0]}</span>
      <div style="flex:1;min-width:0">
        <div style="font-size:11.5px;font-weight:800;color:${st[2]}">${st[1]}</div>
        <div style="font-size:9.5px;color:var(--sub);margin-top:2px;line-height:1.5">마지막 확인 ${_mdh(m.checked_at)}${next?' · '+next:''}${login}${m.pending?' · <span style="color:var(--gold)">못 올린 영상 1편 대기</span>':''}${m.book?' · 📚 '+esc(m.book):''}</div>
        ${m.result?`<div style="font-size:9.5px;color:${fail?'var(--gold)':'var(--muted)'};margin-top:2px;line-height:1.45">${fail?'⚠️ ':'· '}${esc(m.result)}</div>`:""}
      </div>
    </div>${todo}</div>`;
}
function noticeItems(){ return STUDIO_ITEMS.filter(x=>x&&x.type==="notice"&&!x.done); }
function noticeCard(r){
  return `<div class="card" style="padding:12px;margin-bottom:10px;border:1px solid rgba(245,158,11,.55);background:rgba(245,158,11,.08)">
    <div style="font-size:12px;font-weight:800;color:var(--gold)">${esc(r.title||"알림")}</div>
    ${r.msg?`<div style="font-size:10px;color:var(--sub);margin-top:4px;line-height:1.55">${esc(r.msg)}</div>`:""}
    ${_todoList(r.todo)}
    <div style="display:flex;align-items:center;margin-top:8px">
      <span style="font-size:8px;color:var(--muted)">🤖 Mint 자동 · ${esc(r.ts||"")}</span>
      <button class="pill" style="font-size:9px;color:var(--mint);margin-left:auto" onclick="noticeDone(${r.id})">✅ 했어요</button>
    </div></div>`;
}
function noticeDone(id){ const it=STUDIO_ITEMS.find(x=>x.id===id); if(!it) return; it.done=true; it.read=true; it.upd=Date.now(); it.done_at=new Date().toISOString(); persistStudio(); switchStudio(); }
// 📝 글 한 줄 (v13.8) — Mint가 같은 사연으로 쓴 블로그 글. 본문은 Mint·Blogger에만 있음
function _essayLine(r){ const e=r.essay; if(!e) return "";
  if(e.ok===false) return `<div style="font-size:9.5px;color:var(--gold);margin-top:5px;line-height:1.5">📝 글은 이번에 못 만들었어요: ${esc(e.msg||"")}</div>`;
  if(e.posted) return `<div style="font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5">📝 글 「${esc(e.title||"")}」 · <b style="color:var(--mint)">Blogger에 게시됨</b>${e.url?` · <a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:var(--sky)">보기</a>`:""}${e.book?` · 📚 ${esc(e.book)}`:""}</div>`;
  return `<div style="font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5">📝 글 「${esc(e.title||"")}」${e.chars?` ${esc(String(e.chars))}자`:""} · ${e.edit?'Blogger에 <b>임시저장</b> — 읽어 보고 게시해 주세요':'Mint에 저장됨 (Blogger 연결 전)'}${e.book?` · 📚 ${esc(e.book)}`:""}</div>`; }
// 📊 조회 한 줄 (v14.0) — Mint가 하루 한 번 YouTube에서 읽어 붙임 (시청 %는 YouTube 분석 권한이 있을 때만)
function _statsLine(r){ const s=r.stats; if(!s) return "";
  const f=n=>typeof n==="number"?n.toLocaleString("ko-KR"):"–";
  const d=s.at?new Date(s.at):null; const when=d&&!isNaN(d)?`${d.getMonth()+1}/${d.getDate()} 기준`:"";
  return `<div style="font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5">📊 👁 <b style="color:var(--text)">${f(s.views)}</b> · 👍 ${f(s.likes)} · 💬 ${f(s.comments)}${typeof s.avp==="number"?` · 시청 <b style="color:var(--text)">${Math.round(s.avp)}%</b>`:""}${s.privacy&&s.privacy!=="public"?" · 아직 비공개":""}${when?` <span style="color:var(--muted)">· ${when}</span>`:""}</div>`; }
// 최근 성과를 다음 사연 고를 때 참고만 (공개 4편 이상, 올린 지 2일 넘은 것만 — 숫자가 자리 잡은 뒤)
function recentPerformanceHint(){
  const now=Date.now();
  const rows=shortsItems().filter(r=>r.pkg&&r.stats&&r.stats.privacy==="public"&&typeof r.stats.views==="number")

const ESSAY_TAGS=["제목","요약","본문","질문","출처","태그"];
function _essayParse(t){
  const s=String(t||"").replace(/\r/g,""); const sec={};
  const re=new RegExp("\\[("+ESSAY_TAGS.join("|")+")\\][ \\t]*\\n?([\\s\\S]*?)(?=\\n[ \\t]*\\[(?:"+ESSAY_TAGS.join("|")+")\\]|$)","g");
  let m; while((m=re.exec(s))) sec[m[1]]=m[2].trim();
  return sec;
}
function _essayCheck(e,pkg){
  const iss=[]; const n=(e.body||"").replace(/\s/g,"").length;
  if(n<1100) iss.push(`본문이 짧아요 (띄어쓰기 빼고 ${n}자 — 1,200자 이상)`);
  if(n>3200) iss.push(`본문이 길어요 (띄어쓰기 빼고 ${n}자 — 2,000자 안팎)`);
  if(!e.title) iss.push("제목이 없어요");
  const narr=((pkg.mint&&pkg.mint.cuts)||[]).map(c=>String(c.narration||"").trim()).filter(x=>x.length>12);
  const same=narr.filter(x=>(e.body||"").includes(x)).length;
  if(narr.length && same>narr.length/2) iss.push("쇼츠 나레이션 문장을 그대로 옮긴 곳이 많아요 — 새로 쓰기");

async function autoEssay(pkg){

  const body=`[#${pkg.no||""}] ${pkg.title||seed.title||""} — 이 사연으로 블로그 글 한 편을 쓴다.

사연: ${seed.story||""}

규칙:
- 본문 1,500~2,500자 (띄어쓰기 빼고 약 1,200~2,000자). 문단은 2~4문장, 문단 사이 빈 줄.

- 인용은 출처가 확실한 것만 (책 제목과 저자, 속담, 경전의 책·장·절). 확실하지 않으면 인용하지 않는다. 지어낸 인용 금지.

- 태그 3~6개 (예: 부모, 유품, 그리움, 삶의 지혜).

아래 형식 그대로, 다른 말 없이:

검색에 걸릴 만한 자연스러운 제목 (30자 이내)
[요약]
글을 소개하는 한 문장 (80자 이내)
[본문]
(본문)
[질문]
(질문 한 줄)
[출처]
(인용 출처, 없으면 "없음")
[태그]
태그1, 태그2, 태그3`;
  let best=null;

async function _finBlocks(file){

  if(/^image\/(png|jpeg|gif|webp)$/.test(t)||/\.(png|jpe?g|gif|webp)$/.test(n)){
    const mt=/png/.test(t+n)?"image/png":/gif/.test(t+n)?"image/gif":/webp/.test(t+n)?"image/webp":"image/jpeg";
    return [{type:"image",source:{type:"base64",media_type:mt,data:await _b64(file)}}]; }
  if(/\.(csv|txt|tsv|ofx|qfx)$/.test(n)||/^text\//.test(t)){
    let s=await _txt(file); if(s.length>90000) s=s.slice(0,90000)+"\n…(뒷부분 생략)";

  if(/heic|heif/.test(t+n)) throw new Error("HEIC 사진은 못 읽어요 — 사진 앱에서 JPG로 공유하거나 화면 캡처로 올려 주세요");

function finSave(i){

  const d=x.d; d.account_last4=String(d.account_last4||"").replace(/\D/g,"").slice(-4);
  const key=_finKey(d);
  FIN.docs=FIN.docs.filter(o=>_finKey(o.d)!==key);       // 같은 계좌·같은 기간은 새것으로 바꿈

  persistFin(); FIN_PENDING.splice(i,1);

  const r=document.getElementById("finUploadResult"); if(r) r.innerHTML=finPendingHTML();
}

    const k=[d.doc_type,(d.institution||"").toLowerCase().replace(/\W/g,""),d.account_last4||"",(d.loan&&d.loan.kind)||""].join("|");
    const t=d.period_end||d.as_of||""; if(!by[k]||t>(by[k].d.period_end||by[k].d.as_of||"")) by[k]=o; });
  return Object.values(by);
}

// ── v15.1 돈의 흐름 · 집 · 점검 신호 (API 없이 숫자로) ──
function _latestBy(type, keyf){ const by={}; FIN.docs.forEach(o=>{ const d=o.d; if(d.doc_type!==type) return; const k=keyf(d); const t=_finWhen(d); if(!by[k]||t>_finWhen(by[k].d)) by[k]=o; }); return Object.values(by); }
function _payPer(){
  const ps=FIN.docs.filter(o=>o.d.doc_type==="paystub"&&o.d.paystub&&o.d.paystub.gross).map(o=>o.d.paystub).sort((a,b)=>(b.pay_date||"")>(a.pay_date||"")?1:-1);
  const f=(ps[0]||{}).pay_frequency; const tab={weekly:52,biweekly:26,semimonthly:24,monthly:12};
  if(tab[f]) return {per:tab[f], ps};
  if(ps.length>1){ const g=Math.abs((new Date(ps[0].pay_date)-new Date(ps[1].pay_date))/864e5); if(g>=6&&g<=8) return {per:52,ps}; if(g>=13&&g<=15) return {per:26,ps}; if(g>=14.5&&g<=17) return {per:24,ps}; if(g>=27&&g<=32) return {per:12,ps}; }
  return {per:26, ps, guessed:true};
}
function _p2p(){   // 은행 명세서의 사람 간 송금·수표: 같은 금액이 다시 들어온 건 '대신 내고 돌려받음'으로 짝지음
  const out=[];
  _latestBy("bank",d=>(d.institution||"")+"|"+(d.account_last4||"")).forEach(o=>{
    const L=(o.d.p2p||[]).map((x,i)=>Object.assign({i, key:o.id+"|"+i},x,{amount:Math.abs(Number(x.amount)||0)}));
    const ins=L.filter(x=>x.direction==="in"), used=new Set();
    L.filter(x=>x.direction==="out"&&x.amount).forEach(x=>{
      const m=ins.find(y=>!used.has(y.i)&&Math.abs(y.amount-x.amount)<=1);
      if(m){ used.add(m.i); out.push(Object.assign({matched:true, by:m.channel},x)); } else out.push(Object.assign({matched:false},x));
    });
  });
  return out;
}
function finFlow(){

  if(P){ const avg=k=>{ const v=ps.slice(0,2).map(x=>Number(x[k])||0); return v.reduce((a,b)=>a+b,0)/v.length; };
    F.grossMo=avg("gross")*per/12; F.netMo=avg("net")*per/12;
    F.k401Mo=(avg("pretax_401k")+avg("roth_401k"))*per/12; F.matchMo=avg("employer_match")*per/12;

  loans.forEach(o=>{ const L=o.d.loan||{}; const pay=Number(L.new_payment)||Number(L.payment)||Math.abs(Number((o.d.balance||{}).min_payment)||0);
    add("fixed", L.kind==="mortgage"?"모기지 (원리금+에스크로)":L.kind==="home_equity"?"홈에퀴티 대출":"기타 대출", pay); });

    const yr=(Number(I.premium)||0)*(12/(Number(I.term_months)||12)); add("fixed", I.kind==="auto"?"자동차 보험":I.kind==="home"?"주택 보험":"보험", yr/12); });

  _latestBy("brokerage",d=>(d.institution||"")+"|"+(d.account_last4||"")).forEach(o=>{ const c=Number((o.d.flows||{}).contributions)||0; if(c) F.brokerMo=(F.brokerMo||0)+c; });

async function _vaultKey(pass, salt){ const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
const _b64e=u=>btoa(String.fromCharCode(...new Uint8Array(u))), _b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function vaultExport(){
  const msg=document.getElementById("vaultMsg");
  const pass=prompt("백업 암호 (8자 이상, 꼭 기억해 두세요)"); if(!pass) return;
  if(pass.length<8){ if(msg) msg.innerHTML='<span style="color:var(--danger)">8자 이상으로 해 주세요</span>'; return; }
  if(prompt("한 번 더 입력")!==pass){ if(msg) msg.innerHTML='<span style="color:var(--danger)">암호가 서로 달라요</span>'; return; }
  const g=k=>{ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } };
  const plain=JSON.stringify({fin:g('histara_fin'), personal:g('histara_personal'), portfolio:g('histara_portfolio'), kids:g('histara_kids'), retire:g('histara_retire')});
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, await _vaultKey(pass, salt), new TextEncoder().encode(plain));
  const o={format:"histara-vault/1", created:new Date().toISOString(), salt:_b64e(salt), iv:_b64e(iv), data:_b64e(ct)};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));
  a.download=`histara_백업_${new Date().toISOString().slice(0,10)}.hvault.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
  if(msg) msg.innerHTML='<span style="color:var(--mint)">✓ 백업 파일을 만들었어요 (암호 없이는 열 수 없어요)</span>';

function editRetire(){
  const ask=(q,v)=>{ const a=prompt(q, v); if(a===null) return null; const n=parseFloat(String(a).replace(/[^0-9.]/g,'')); return isNaN(n)?v:n; };
  const p=RETIRE;
  const v1=ask("은퇴 나이", p.retireAge); if(v1===null) return; p.retireAge=v1;
  const v2=ask("매달 저축·투자 합계 ($) — 401k 본인+회사 매칭+IRA 등", p.monthly); if(v2===null) return; p.monthly=v2;
  const v3=ask("지금 투자 자산 합계 대략 ($) — 401k+IRA+주식", p.current); if(v3===null) return; p.current=v3;
  const v4=ask("연 소득 대략 ($, 세전)", p.income); if(v4===null) return; p.income=v4;
  const v5=ask("저축액을 매년 몇 % 늘릴지 (보통 1~3)", p.raise); if(v5===null) return; p.raise=v5;
  p.age=ageNow(); p.set=true; persistRetire(); renderAll();
}

function speakEn(t){
  t=String(t||"").trim(); if(!t) return;
  if(!("speechSynthesis" in window)){ showErr("이 브라우저는 소리 읽기를 지원하지 않아요 — 카드의 '🔈 구글 번역으로 듣기'를 쓰세요"); return; }
  try{
    const ss=window.speechSynthesis;
    if(ss.speaking||ss.pending) ss.cancel();          // 말하는 중일 때만 (iPhone: 매번 cancel 하면 소리가 안 남)
    const u=new SpeechSynthesisUtterance(t);
    // iPhone은 목록에 있어도 실제로는 못 쓰는 음성이 있어, 직접 고른 경우가 아니면 음성을 지정하지 않고 언어만 정함
    const v=(IS_IOS && !_enSaved()) ? null : enVoicePick();
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang="en-US";
    u.rate=0.92; u.pitch=1.0; u.volume=1.0;

    u.onstart=()=>{ started=true; enDiag(`재생 시작 ✓ (${v?v.name:"기기 기본 영어 음성"})`); };
    u.onerror=(e)=>{ enDiag("오류: "+(e&&e.error||"알 수 없음")); if(!started) showErr("소리 읽기 오류("+(e&&e.error||"?")+") — 무음 모드를 끄거나 '🔈 구글 번역으로 듣기'를 쓰세요"); };
    clearTimeout(_enTimer);
    _enTimer=setTimeout(()=>{ if(!started){ enDiag("2초 안에 재생이 시작되지 않음"); showErr(IS_IOS
      ? "소리가 안 나요? 아이폰은 무음 모드(옆 스위치/동작 버튼)가 켜져 있으면 읽기 소리가 꺼져요. 무음을 끄고 볼륨을 올린 뒤 다시 눌러 보세요. 그래도 안 되면 카드의 '🔈 구글 번역으로 듣기'."

    ss.speak(u);
    if(ss.paused) ss.resume();
  }catch(e){ showErr("이 기기에서 소리 읽기를 지원하지 않아요"); }
}

async function convene(){
  const box=document.getElementById("conveneResult");
  if(!box)return;
  const keys=Object.keys(OPS_AREAS);
  const failing=keys.filter(k=>areaStatus(k)==="fail").map(k=>OPS_AREAS[k].label);
  const idle=keys.filter(k=>areaStatus(k)==="idle").map(k=>OPS_AREAS[k].label);
  box.innerHTML=`<div class="spinner"></div><div class="loading-txt">Atlas가 회의를 소집하는 중...</div>`;
  const sys=`You are Atlas (ADM-00), Operations Administrator of the Histara Agency.
Team (v12): ${AGENTS.map(a=>a.name+' — '+a.role).join('; ')}.
You monitor whether each team performs its role and convene meetings to fix gaps. Respond in Korean. Return ONLY JSON.`;
  const usr=`Failing areas: ${failing.length?failing.join(", "):"(없음)"}. Not-yet-run areas: ${idle.length?idle.join(", "):"(없음)"}.
Convene an operations meeting. JSON: {"title":"회의 제목","attendees":["담당 에이전트들"],"agenda":["안건1","안건2"],"resolutions":["보완책1","보완책2","보완책3"],"owner":"후속 책임 주체","summary":"한 줄 요약"}`;
  const raw=await callClaude(sys,usr);
  const _g=keyGuard(raw); if(_g){box.innerHTML=_g; return;}
  const p=pj(raw);
  if(p){
    recordHealth("meeting",true);
    // add to meetings log + save to report inbox
    const mtg={id:Date.now(), title:p.title||"운영 점검 회의", team:(p.attendees||["Atlas"]),
      time:new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}),
      status:"완료", results:(p.resolutions||[])};
    if(typeof MEETINGS!=='undefined') MEETINGS.unshift(mtg);
    let h=`<div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;margin-bottom:6px">${esc(p.title)}</div>`;
    h+=`<div style="font-size:10px;color:var(--sub);margin-bottom:8px">참석: ${(p.attendees||[]).join(" · ")}</div>`;
    if((p.agenda||[]).length){ h+=`<div class="lbl" style="color:var(--gold)">안건</div>`; p.agenda.forEach(x=>h+=`<div class="row-item"><div class="dot" style="background:var(--gold)"></div><span>${esc(x)}</span></div>`); }
    h+=`<div class="lbl" style="margin-top:8px;color:var(--mint)">보완책</div>`;
    (p.resolutions||[]).forEach(x=>h+=`<div class="row-item"><div class="dot" style="background:var(--mint)"></div><span>${esc(x)}</span></div>`);
    if(p.owner) h+=`<div style="font-size:10px;color:var(--sub);margin-top:8px">후속 책임: <b style="color:var(--text)">${esc(p.owner)}</b></div>`;
    stageReport("briefing","Atlas (ADM-00)", esc(p.title), h, p.summary||"");
    box.innerHTML=`<div class="card" style="border-color:rgba(47,232,160,.3)">${h}${saveBar("회의록 보고함에 저장")}</div>`;
  } else { recordHealth("meeting",false); box.innerHTML=`<div class="card" style="color:var(--danger);font-size:12px;text-align:center;padding:16px">회의 소집 실패 — 잠시 후 다시 시도하세요.</div>`; }
}

Scout searches literature, Dr. Han interprets clinically, Reviewer checks citations and standards.

Answer at CHS / lab-director level — precise, no layperson padding. Keep technical terms in English (HLA, DSA, MFI, eplet, SAB, XM, cPRA, NGS, allele, prozone, C1q); write connective prose in Korean.

Return ONLY JSON.`;
  const usr=`${k.task}
Question/topic: "${q}"
JSON: {"title":"글 제목 (짧게)","conclusion":["결론 1 (한 줄)","결론 2","결론 3"],"evidence":[{"claim":"이 근거가 말하는 것 1~2문장","source":"First author et al., Journal 또는 기관·문서명","year":"2025","pmid":"","doi":"","url":"","level":"근거 수준"}],"practice":["랩 실무 적용 1","2"],"limits":["한계·불확실성 1","2"],"tags":["짧은 태그 3~5개, 예: crossmatch, DSA"]}`;
  try{
    liveLog(box,`${k.icon} ${k.who}가 자료를 찾아 정리 중... (30~60초)`);
    const raw=await callClaude(sys, usr, sx(kind==="papers"?5:4));
    const g=keyGuard(raw); if(g){ box.innerHTML=g; return; }

    let checks=null;

        r2.checks.forEach(c=>{ const e=(p.evidence||[])[Number(c.i)-1]; if(e && c.pmid && /^\d{5,9}$/.test(String(c.pmid))) e.pmid=String(c.pmid); }); }

}

function buildBubbles(){

  if(S.stage){const who={story:"nova",essay:"theo",video:"choi",upload:"choi"}[S.stage];if(who&&!seen.has(who))list.unshift({agent:who,text:STAGE_TXT[S.stage]});}

  for(const b of list){const key=b.agent+"|"+(b.al?b.al.text:b.text);keep.add(key);if(BUB.has(key))continue;const a=AG[b.agent];let el;
    if(b.al&&b.al.act&&b.al.act.kind==="link"){el=document.createElement("a");el.href=b.al.act.url;el.target="_blank";el.rel="noopener";}
    else{el=document.createElement("button");el.type="button";el.addEventListener("click",()=>openSheet(b.agent,true));}
    el.className="hof-bubble "+(b.al?b.al.sev:"info quiet");
    el.innerHTML=`<span class="who">${a.name}${b.more?`<span class="more">외 ${b.more}건</span>`:""}</span>${esc(b.al?b.al.text:b.text)}${b.al&&b.al.act?`<span class="go">${esc(b.al.act.label)} ›</span>`:""}`;
    el.style.opacity="0";bubbleBox.appendChild(el);requestAnimationFrame(()=>{el.style.opacity="1";});BUB.set(key,{el,agent:b.agent});}

  for(const {el,a} of all){
    if(a.hidden){el.style.visibility="hidden";continue;}el.style.visibility="visible";
    const [x,y]=iso(a.gx,a.gy),sx=x*scale,sy=(y-(a.mode==="sleep"?28:32))*scale,w=el.offsetWidth,h=el.offsetHeight;
    const hit=(l,t)=>placed.some(p=>l<p.l+p.w+3&&l+w+3>p.l&&t<p.t+p.h+3&&t+h+3>p.t);
    const fit=(l,t)=>[Math.max(4,Math.min(W-w-4,l)),Math.max(2,Math.min(Hc-h-2,t))];
    let pick=null;for(const [l,t,tail] of [[sx-w/2,sy-h-8,1],[sx+12,sy-h+6,0],[sx-w-12,sy-h+6,0],[sx-w/2,sy+40*scale,0],[sx-w/2,sy-2*h-16,1]]){const [L,Tt]=fit(l,t);if(!hit(L,Tt)){pick=[L,Tt,tail];break;}}
    if(!pick){const [L,Tt]=fit(sx-w/2,sy-h-8);pick=[L,Tt,1];}
    placed.push({l:pick[0],t:pick[1],w,h});el.classList.toggle("notail",!pick[2]);
    el.style.setProperty("--tail",Math.max(10,Math.min(w-10,sx-pick[0]))+"px");el.style.transform=`translate(${pick[0]}px,${pick[1]}px)`;}
}

// ── 상태 줄 · 할 일 · 직원 ──
function steps(t){return `<ol class="hof-steps">${(t||[]).map(x=>`<li>${esc(x).replace(/(python3 [^\s].*?(?:--\w+(?: \d+)?|\.py))(?=\s|$)/g,"<code>$1</code>")}</li>`).join("")}</ol>`;}
function renderStatus(){
  const S=SCENE,st=S.st,el=root.querySelector(".hof-status");
  if(!st){el.innerHTML=`<i class="hof-dot warn"></i><div><b>Mint 소식 기다리는 중</b><br><span>Mint 자동 제작이 처음 확인하면 나타나요</span></div>`;return;}
  const head=S.stage?`🎬 제작 중 · ${STAGE_TXT[S.stage]}`:(S.stale?"Mint 소식이 끊겼어요":(S.sev==="crit"?"확인이 필요해요":(S.sev==="warn"?"결재할 일이 있어요":"Mint 자동 제작 · 정상")));
  const parts=[];if(nextTxt(st)&&!S.stage)parts.push(`다음 제작 ${nextTxt(st)}`);if(st.login_until)parts.push(`로그인 ${md(st.login_until)}까지`);if(st.book)parts.push(`📚 ${String(st.book).replace(/\s*\(.*\)/,"")}`);
  el.innerHTML=`<i class="hof-dot ${S.sev==="ok"?"":S.sev}"></i><div style="min-width:0"><b>${esc(head)}</b><br><span>${esc(parts.join(" · "))}</span></div>`;
}
function renderTodo(){
  const S=SCENE,box=root.querySelector(".hof-todo");
  if(!S.alerts.length){box.innerHTML=`<div class="hof-empty">지금은 결재할 일이 없어요.</div>`;return;}
  box.innerHTML=`<div class="hof-todo-h">지금 할 일 ${S.alerts.length}</div>`+S.alerts.map((al,i)=>{const lab={crit:"급함",warn:"할 일",info:"알림"}[al.sev];
    const act=al.act.kind==="link"?`<a class="hof-act" href="${esc(al.act.url)}" target="_blank" rel="noopener">${esc(al.act.label)} ›</a>`:`<button class="hof-act" type="button" data-i="${i}" aria-expanded="false">${esc(al.act.label)}</button>`;
    return `<div class="hof-item"><span class="hof-pill ${al.sev}">${lab}</span><div><div class="t">${esc(al.text)}</div><div class="d">${esc(AG[al.agent].name)}${al.detail?" · "+esc(al.detail):""}</div></div>${act}<div class="hof-sw" hidden style="grid-column:1/-1"></div></div>`;}).join("");
  box.querySelectorAll("button.hof-act").forEach(b=>b.addEventListener("click",()=>{const w=b.parentElement.querySelector(".hof-sw"),al=S.alerts[+b.dataset.i];
    if(w.hidden)w.innerHTML=steps(al.act.todo);w.hidden=!w.hidden;b.setAttribute("aria-expanded",String(!w.hidden));}));
}
function renderRoster(){
  const r=root.querySelector(".hof-roster");
  r.innerHTML=AGENTS.map(a=>`<button class="hof-chip" type="button" data-id="${a.id}" aria-pressed="${selected===a.id}"><i style="background:${a.color}"></i><span>${a.name}<br><small>${esc(cut(a.hidden?"퇴근":a.doing,16))}</small></span></button>`).join("");
  r.querySelectorAll(".hof-chip").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.id)));
}
function closeSheet(){selected=null;root.querySelector(".hof-sheet").hidden=true;AGENTS.forEach(x=>x.selected=false);renderRoster();}
function openSheet(id,force){
  const sh=root.querySelector(".hof-sheet");if(selected===id&&!force){closeSheet();return;}
  selected=id;const a=AG[id];AGENTS.forEach(x=>x.selected=x.id===id);const rn=ROOMS[roomAt(a.gx,a.gy)];
  sh.innerHTML=`<div class="hof-sheet-head"><i style="background:${a.color}"></i><div><b>${a.name}</b><small>${esc(a.role)} · ${esc(rn?rn.name:"복도")}</small></div><button class="hof-close" type="button">닫기</button></div>
    <p>${esc(a.hidden?"퇴근했어요. 결재함에 쌓인 일은 아래 '지금 할 일'에 있어요.":a.doing)}</p>
    ${(a.alerts||[]).map(x=>`<div><b>${esc(x.text)}</b><div style="color:var(--hof-muted);font-size:11.5px">${esc(x.detail||"")}</div>${x.act.kind==="link"?`<a class="hof-act" style="display:inline-block;margin-top:6px" href="${esc(x.act.url)}" target="_blank" rel="noopener">${esc(x.act.label)} ›</a>`:steps(x.act.todo)}</div>`).join("")}
    <div><small style="color:var(--hof-muted)">맡은 일</small><ul>${a.duties.map(d=>`<li>${esc(d)}</li>`).join("")}</ul></div>`;
  sh.hidden=false;sh.querySelector(".hof-close").addEventListener("click",closeSheet);renderRoster();
}

// ── 움직임 ──
function stepFrame(now){
  if(!running)return;if(!root.isConnected){running=false;return;}
  const dt=Math.min(0.1,(now-last)/1000);last=now;acc+=dt;if(acc<1/30){requestAnimationFrame(stepFrame);return;}const d=acc;acc=0;T+=d;
  NIGHT+=((isNight()?1:0)-NIGHT)*Math.min(1,d*(reduce?99:1.6));
  for(const a of AGENTS){a.phase+=d;if(a.path.length){const p=a.path[0],dx=p.gx-a.gx,dy=p.gy-a.gy,dist=Math.hypot(dx,dy),sp=1.9*d;
    if(dist<=sp){a.gx=p.gx;a.gy=p.gy;a.path.shift();}else{a.gx+=dx/dist*sp;a.gy+=dy/dist*sp;}a.walking=a.path.length>0;}else a.walking=false;}
  tick+=d;if(tick>1){tick=0;const before=AGENTS.map(a=>a.doing).join("|");assign(now);if(AGENTS.map(a=>a.doing).join("|")!==before)renderRoster();}
  idleChat(now);draw();placeBubbles();requestAnimationFrame(stepFrame);
}
function setRunning(on){if(on&&!running&&root&&root.isConnected){running=true;last=performance.now();requestAnimationFrame(stepFrame);}else if(!on)running=false;}
let firstMount=true;
function refresh(){ if(!root)return; try{ SCENE=derive(source()||[],new Date()); }catch(e){ SCENE={st:null,alerts:[],stage:null,sev:"ok",info:{}}; }
  assign(performance.now());buildBubbles();renderStatus();renderTodo();renderRoster();if(selected)openSheet(selected,true); }
function mount(el){
  if(!el)return; if(!root)build(); el.appendChild(root); resize();
  if(firstMount){ firstMount=false; NIGHT=isNight()?1:0; const z=store.get("histara_office_zoom",null); setZoom(z==null?(scroller.clientWidth<560):z==="1",false); }
  refresh(); draw(); setRunning(true);
}
// Histara가 화면을 다시 그려도(#hofficeMount 자리가 새로 생겨도) 저절로 다시 붙는다
function autoMount(){ const tryMount=()=>{ const m=document.getElementById("hofficeMount"); if(m&&(!root||root.parentNode!==m)) mount(m); };
  tryMount(); if("MutationObserver" in window) new MutationObserver(tryMount).observe(document.body,{childList:true,subtree:true}); }
window.HOffice={mount,refresh,autoMount,setSource(fn){source=fn;refresh();},derive};
})();

HOffice.autoMount();
try{ if(typeof STATE!=="undefined"&&STATE.tab==="home") renderContent(); }catch(e){}
</script>
